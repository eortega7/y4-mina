<style>
:root{--bg:#F3F6F9;--surface:#FFFFFF;--ink:#13233A;--muted:#566782;--line:#DCE3EC;--accent:#0A6C8F;--bad:#B4452F;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#0D1520;--surface:#162131;--ink:#E7EDF5;--muted:#9BABC3;--line:#263449;--accent:#5EC0E6;--bad:#F08B73;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;display:grid;place-items:center;padding-inline:16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1.15;margin:0}
p{margin:0;color:var(--muted);font-size:.95rem}
label{font-weight:700;display:flex;flex-direction:column;gap:6px}
input{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:700;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme: dark){button{color:#0D1520}}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-weight:700;min-height:1.5em}
</style>
</head>

const KEY_NAME = "y4mina-key";
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...u));
async function derive(code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.trim().toLowerCase()), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64d(P.salt), iterations:P.iter, hash:"SHA-256"}, base, 256));
}
async function openWith(raw){
  const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(P.iv)}, k, b64d(P.ct));
  return new TextDecoder().decode(pt);
}
const domReady = new Promise(r => document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", r, {once:true}) : r());
async function show(html){
  await domReady;
  const doc = new DOMParser().parseFromString(html, "text/html");
  document.documentElement.lang = doc.documentElement.lang || "en";
  document.head.replaceWith(document.adoptNode(doc.head));
  document.body.replaceWith(document.adoptNode(doc.body));
  // Scripts parsed by DOMParser don't run; recreate them so they do.
  document.body.querySelectorAll("script").forEach(old => {
    const s = document.createElement("script");
    s.textContent = old.textContent;
    old.replaceWith(s);
  });
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
}
const form = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_NAME); } catch(e){}
  if (saved){
    let html = null;
    try { html = await openWith(b64d(saved)); }
    catch(e){ try { localStorage.removeItem(KEY_NAME); } catch(_){} }  // code changed: ask again
    if (html !== null){ await show(html); return; }
  }
  form.hidden = false;
  document.getElementById("code").focus();
})();
form.addEventListener("submit", async e => {
  e.preventDefault();
  err.textContent = ""; go.disabled = true; go.textContent = "Opening…";
  try {
    const raw = await derive(document.getElementById("code").value);
    var html = await openWith(raw);
    try { localStorage.setItem(KEY_NAME, b64e(raw)); } catch(_){}
  } catch(ex){
    err.textContent = "That code didn't work. Check the code in the WhatsApp group and try again.";
    go.disabled = false; go.textContent = "Open";
    return;
  }
  await show(html);
});
